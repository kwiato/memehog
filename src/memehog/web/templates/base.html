<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Memehog{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐗</text></svg>">
  <script src="https://unpkg.com/htmx.org@1.9.12" defer></script>
</head>
<body>
  {% block content %}{% endblock %}
  <div id="modal"></div>
  <script>
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') document.getElementById('modal').innerHTML = '';
    });

    async function shareItem(url) {
      const abs = new URL(url, location.href).href;
      if (navigator.share) {
        try { await navigator.share({ url: abs }); return; }
        catch (e) { if (e.name === 'AbortError') return; }
      }
      // No system share sheet (needs HTTPS) — fall back to copying the link.
      try { await navigator.clipboard.writeText(abs); }
      catch {
        const t = document.createElement('textarea');
        t.value = abs; document.body.appendChild(t); t.select();
        document.execCommand('copy'); t.remove();
      }
      alert('Link copied to clipboard');
    }
  </script>
</body>
</html>
