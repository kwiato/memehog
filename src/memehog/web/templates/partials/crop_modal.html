<div class="modal-backdrop" onclick="if (event.target === this) document.getElementById('modal').innerHTML = ''">
  <div class="modal-box panel crop-box">
    <button class="close" onclick="document.getElementById('modal').innerHTML = ''">✕</button>
    <h2>✂️ Crop meme #{{ item.id }}</h2>
    <div class="crop-stage">
      <img id="crop-image" src="/media/{{ item.filename }}" alt="meme to crop">
    </div>
    <div class="vlm-actions">
      <button class="btn primary" id="crop-save">💾 Save (replaces the original)<span class="spin"></span></button>
      <button class="btn" onclick="document.getElementById('modal').innerHTML = ''">Cancel</button>
      <span id="crop-status" class="vlm-test"></span>
    </div>
    <script>
      (function () {
        const img = document.getElementById('crop-image');
        const cropper = new Cropper(img, {
          viewMode: 1,
          autoCropArea: 1,
          background: false,
        });
        const btn = document.getElementById('crop-save');
        const status = document.getElementById('crop-status');
        const isPng = {{ 'true' if item.mime == 'image/png' else 'false' }};
        btn.addEventListener('click', () => {
          if (!confirm('Replace the original meme with this crop?')) return;
          btn.disabled = true;
          btn.classList.add('htmx-request');  // shows the button spinner
          cropper.getCroppedCanvas().toBlob(async (blob) => {
            const fd = new FormData();
            fd.append('file', blob, isPng ? 'crop.png' : 'crop.jpg');
            try {
              const resp = await fetch('/ui/items/{{ item.id }}/crop',
                                       { method: 'POST', body: fd });
              const data = await resp.json();
              if (data.ok) { location.reload(); return; }
              status.className = 'vlm-test error';
              status.textContent = '❌ ' + (data.error || 'crop failed');
            } catch (err) {
              status.className = 'vlm-test error';
              status.textContent = '❌ ' + err;
            }
            btn.disabled = false;
            btn.classList.remove('htmx-request');
          }, isPng ? 'image/png' : 'image/jpeg', 0.95);
        });
      })();
    </script>
  </div>
</div>
