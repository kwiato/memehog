<table class="clients-table">
  <thead>
    <tr><th>Active</th><th>Name</th><th>Model</th><th>Endpoint</th><th>Status</th><th></th><th></th></tr>
  </thead>
  <tbody>
    {% for p in profiles %}
    <tr>
      <td>
        <label class="active-toggle" title="Active models index new memes every night, each keeping its own searchable text">
          <input type="checkbox" {{ 'checked' if p.active else '' }}
                 hx-post="/ui/vlm/profiles/{{ p.id }}/toggle"
                 hx-target="#profiles" hx-swap="innerHTML">
        </label>
      </td>
      <td><strong>{{ p.name }}</strong></td>
      <td><code>{{ p.model }}</code></td>
      <td class="muted profile-url">{{ p.base_url }}</td>
      <td>
        {% set h = health.get(p.id) %}
        {% if not h or h.total == 0 %}
        <span class="health ok" title="No errors recorded">●</span>
        {% else %}
        <button class="health-btn {{ h.level }}"
                hx-get="/ui/vlm/profiles/{{ p.id }}/errors"
                hx-target="#modal" hx-swap="innerHTML"
                title="{{ h.connection }} connection / {{ h.response }} bad-response error(s) in the last 24h — click for the log">
          ● {{ h.connection + h.response if h.level != 'ok' else h.total }}
        </button>
        {% endif %}
      </td>
      <td><span id="profile-test-{{ p.id }}"></span></td>
      <td class="row-actions">
        <button class="btn small" hx-post="/ui/vlm/profiles/{{ p.id }}/test"
                hx-target="#profile-test-{{ p.id }}" hx-swap="innerHTML"
                hx-disabled-elt="this"
                hx-on::before-request="document.getElementById('profile-test-{{ p.id }}').innerHTML = ''"
                >🧪 Test<span class="spin"></span></button>
        <button class="btn small" hx-get="/ui/vlm/profiles/{{ p.id }}/edit"
                hx-target="#modal" hx-swap="innerHTML">✏️</button>
        <button class="btn small danger" hx-post="/ui/vlm/profiles/{{ p.id }}/delete"
                hx-confirm="Delete model '{{ p.name }}'?"
                hx-target="#profiles" hx-swap="innerHTML">🗑</button>
      </td>
    </tr>
    {% endfor %}
    {% if not profiles %}
    <tr><td colspan="7" class="muted">No models saved yet — add one below.</td></tr>
    {% endif %}
  </tbody>
</table>
