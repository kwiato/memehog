<table class="clients-table">
  <thead>
    <tr><th>Name</th><th>Model</th><th>Endpoint</th><th></th><th></th></tr>
  </thead>
  <tbody>
    {% for p in profiles %}
    <tr>
      <td>
        <strong>{{ p.name }}</strong>
        {% if p.id == selected_profile_id %}<span class="status approved">active</span>{% endif %}
      </td>
      <td><code>{{ p.model }}</code></td>
      <td class="muted profile-url">{{ p.base_url }}</td>
      <td><span id="profile-test-{{ p.id }}"></span></td>
      <td class="row-actions">
        <button class="btn small" hx-post="/ui/vlm/profiles/{{ p.id }}/test"
                hx-target="#profile-test-{{ p.id }}" hx-swap="innerHTML">🧪 Test</button>
        <button class="btn small danger" hx-post="/ui/vlm/profiles/{{ p.id }}/delete"
                hx-confirm="Delete model '{{ p.name }}'?"
                hx-target="#profiles" hx-swap="innerHTML">🗑</button>
      </td>
    </tr>
    {% endfor %}
    {% if not profiles %}
    <tr><td colspan="5" class="muted">No models saved yet — add one below.</td></tr>
    {% endif %}
  </tbody>
</table>
