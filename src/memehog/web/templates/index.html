{% extends "base.html" %}
{% block content %}
<header class="topbar">
  <h1><a class="logo" href="/">🐗 Memehog</a> <span class="count">{{ count }} items</span></h1>
  <form class="filters" hx-get="/ui/items" hx-target="#grid" hx-swap="innerHTML"
        hx-trigger="input changed delay:400ms from:find input[type='search'], change from:find select, change from:find input[name='spicy']">
    <input type="search" name="q" placeholder="Search memes…" autocomplete="off">
    <select name="type">
      <option value="">All types</option>
      <option value="image">Images</option>
      <option value="video">Videos</option>
      <option value="animation">GIFs</option>
    </select>
    <select name="tag">
      <option value="">All tags</option>
      {% for t in tags %}<option value="{{ t.name }}">{{ t.name }}</option>{% endfor %}
    </select>
    <input type="hidden" name="spicy" value="0">
  </form>
  <button class="btn spicy-btn" title="Spicy mode" onclick="toggleSpicy(this)">🔥</button>
  <details class="dropdown">
    <summary class="btn" title="Menu">☰</summary>
    <nav class="dropdown-menu">
      <button hx-get="/ui/settings" hx-target="#modal" hx-swap="innerHTML"
              onclick="this.closest('details').removeAttribute('open')">⚙️ Settings</button>
      <button hx-get="/ui/about" hx-target="#modal" hx-swap="innerHTML"
              onclick="this.closest('details').removeAttribute('open')">ℹ️ About</button>
    </nav>
  </details>
</header>

<main id="grid" class="grid" hx-get="/ui/items?page=1" hx-trigger="load" hx-swap="innerHTML">
  <p class="muted">Loading…</p>
</main>

<button class="fab" title="Add memes" aria-label="Add memes" onclick="openUpload()">
  <svg class="fab-plus" viewBox="0 0 24 24" width="26" height="26" aria-hidden="true">
    <path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  </svg>
  <span class="fab-progress"></span>
</button>

<div id="upload-modal" class="modal-backdrop upload-modal" onclick="if (event.target === this) closeUpload()">
  <div class="modal-box panel">
    <button class="close" onclick="closeUpload()">✕</button>
    <h2>Add memes</h2>
    <form id="upload-form" action="/ui/upload" method="post" enctype="multipart/form-data">
      <label class="dropzone">
        <input type="file" name="files" multiple accept="image/*,video/*">
        <span class="muted">…or just drop files anywhere on the page</span>
      </label>
      <label>Paste a link (Instagram / TikTok / direct)
        <input type="url" name="url" placeholder="https://…">
      </label>
      <div id="caption-row" class="collapse">
        <div class="collapse-inner">
          <label>Caption (optional)
            <input type="text" name="caption" placeholder="Description for search">
          </label>
          <button type="button" id="upload-spicy-btn" class="btn spicy-btn"
                  title="Upload as spicy" onclick="this.classList.toggle('active')">🔥</button>
        </div>
      </div>
      <input type="hidden" name="spicy" value="0">
      <button class="btn primary" type="submit">Add to library</button>
    </form>
  </div>
</div>

<div id="drop-overlay" class="drop-overlay">
  <div class="drop-inner">
    <div class="drop-icon">📥</div>
    <p>Drop to add to the library</p>
    <p class="drop-spicy">🔥 spicy mode on — going straight to the spicy stash</p>
  </div>
</div>

<script>
  const spicyInput = document.querySelector('.filters input[name="spicy"]');
  const spicyOn = () => spicyInput.value === '1';

  function toggleSpicy(btn) {
    spicyInput.value = spicyOn() ? '0' : '1';
    btn.classList.toggle('active', spicyOn());
    document.body.classList.toggle('spicy-mode', spicyOn());
    refreshGrid();
  }

  function refreshGrid() {
    // The filters form listens for this and re-fetches the grid with the
    // current query/type/tag/spicy values.
    spicyInput.dispatchEvent(new Event('change', { bubbles: true }));
  }

  const uploadForm = document.getElementById('upload-form');
  const fileInput = uploadForm.querySelector('input[name="files"]');
  const urlInput = uploadForm.querySelector('input[name="url"]');
  const captionRow = document.getElementById('caption-row');
  const uploadSpicyBtn = document.getElementById('upload-spicy-btn');

  function openUpload() {
    // Default the per-upload 🔥 toggle to the current browsing mode.
    uploadSpicyBtn.classList.toggle('active', spicyOn());
    document.getElementById('upload-modal').classList.add('open');
  }
  function closeUpload() { document.getElementById('upload-modal').classList.remove('open'); }
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeUpload();
  });

  function updateCaptionRow() {
    const filled = fileInput.files.length > 0 || urlInput.value.trim() !== '';
    captionRow.classList.toggle('open', filled);
  }
  fileInput.addEventListener('change', updateCaptionRow);
  urlInput.addEventListener('input', updateCaptionRow);

  function showToast(msg) {
    let box = document.querySelector('.toasts');
    if (!box) {
      box = document.createElement('div');
      box.className = 'toasts';
      document.body.appendChild(box);
    }
    const t = document.createElement('div');
    t.className = 'toast';
    t.textContent = msg;
    box.appendChild(t);
    requestAnimationFrame(() => t.classList.add('show'));
    setTimeout(() => {
      t.classList.remove('show');
      setTimeout(() => t.remove(), 300);
    }, 4000);
  }

  async function postUpload(fd) {
    const resp = await fetch('/ui/upload', {
      method: 'POST',
      body: fd,
      headers: { 'X-Requested-With': 'XMLHttpRequest' },
    });
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    return resp.json();
  }

  // Files upload one at a time (kind to the Pi) through a queue; the FAB
  // shows a spinner with an "n/total" counter while it drains. Duplicates
  // (same file content) are detected server-side and reported in a toast.
  const fab = document.querySelector('.fab');
  const fabProgress = fab.querySelector('.fab-progress');
  const uploadQueue = [];
  let uploading = false;
  let stats = { total: 0, done: 0, added: 0, duplicates: 0, failed: 0 };

  function fabUpdate() {
    const current = Math.min(stats.done + 1, stats.total);
    fabProgress.textContent = `${current}/${stats.total}`;
    fab.title = `Uploading ${current} of ${stats.total}…`;
  }

  function enqueueFiles(files, { caption = '', spicy = spicyOn() } = {}) {
    for (const f of files) uploadQueue.push({ file: f, caption, spicy });
    stats.total += files.length;
    processUploadQueue();
  }

  async function processUploadQueue() {
    if (uploading) { fabUpdate(); return; }
    uploading = true;
    fab.classList.add('busy');
    while (uploadQueue.length) {
      fabUpdate();
      const { file, caption, spicy } = uploadQueue.shift();
      const fd = new FormData();
      fd.append('files', file);
      if (caption) fd.append('caption', caption);
      fd.append('spicy', spicy ? '1' : '0');
      try {
        const r = await postUpload(fd);
        stats.added += r.added;
        stats.duplicates += r.duplicates;
      } catch {
        stats.failed++;
      }
      stats.done++;
    }
    uploading = false;
    fab.classList.remove('busy');
    fab.title = 'Add memes';
    refreshGrid();
    const countEl = document.querySelector('.topbar .count');
    if (stats.added && countEl) {
      const n = parseInt(countEl.textContent, 10) || 0;
      countEl.textContent = `${n + stats.added} items`;
    }
    const parts = [];
    if (stats.added && (stats.duplicates || stats.failed || stats.added > 1)) {
      parts.push(`Added ${stats.added}`);
    }
    if (stats.duplicates) {
      parts.push(`${stats.duplicates} duplicate${stats.duplicates > 1 ? 's' : ''} skipped`);
    }
    if (stats.failed) parts.push(`${stats.failed} failed`);
    if (parts.length) showToast(parts.join(' · '));
    stats = { total: 0, done: 0, added: 0, duplicates: 0, failed: 0 };
  }

  async function submitUrl(url, caption, spicy) {
    const fd = new FormData();
    fd.append('url', url);
    if (caption) fd.append('caption', caption);
    fd.append('spicy', spicy ? '1' : '0');
    try {
      await postUpload(fd);
      showToast('Link queued for download');
    } catch (err) {
      showToast('Queueing the link failed: ' + err.message);
    }
  }

  uploadForm.addEventListener('submit', (e) => {
    e.preventDefault();
    const caption = uploadForm.elements.caption.value.trim();
    const spicy = uploadSpicyBtn.classList.contains('active');
    if (fileInput.files.length) {
      enqueueFiles(Array.from(fileInput.files), { caption, spicy });
    }
    const url = urlInput.value.trim();
    if (url) submitUrl(url, caption, spicy);
    uploadForm.reset();
    updateCaptionRow();
    closeUpload();
  });

  // Whole-page drag&drop: any file dragged over the window shows the overlay
  // and dropping uploads it (as spicy when 🔥 mode is on).
  const overlay = document.getElementById('drop-overlay');
  let dragDepth = 0;
  const hasFiles = (e) =>
    e.dataTransfer && Array.from(e.dataTransfer.types || []).includes('Files');

  window.addEventListener('dragenter', (e) => {
    if (!hasFiles(e)) return;
    e.preventDefault();
    dragDepth++;
    overlay.classList.add('active');
  });
  window.addEventListener('dragover', (e) => {
    if (hasFiles(e)) e.preventDefault();
  });
  window.addEventListener('dragleave', (e) => {
    if (!hasFiles(e)) return;
    if (--dragDepth <= 0) {
      dragDepth = 0;
      overlay.classList.remove('active');
    }
  });
  window.addEventListener('drop', (e) => {
    if (!hasFiles(e)) return;
    e.preventDefault();
    dragDepth = 0;
    overlay.classList.remove('active');
    if (!e.dataTransfer.files.length) return;
    enqueueFiles(Array.from(e.dataTransfer.files));
  });
</script>
{% endblock %}
