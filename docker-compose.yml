services:
  memehog:
    # Prebuilt multi-arch image from CI (also mirrored to ghcr.io/kwiato/memehog);
    # `build:` is the fallback when the image can't be pulled (local clone, forks).
    image: hexdesign/memehog:latest
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: memehog
    restart: unless-stopped
    # Runs as uid 1000 (non-root); the data dir on the host must be
    # writable by that uid: sudo chown -R 1000:1000 <HOST_DATA_DIR>
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      # Values come from .env (docker compose CLI) or from stack env vars
      # (Portainer). No env_file — a git-deployed stack has no .env file.
      BOT_TOKEN: ${BOT_TOKEN:-}
      ALLOWED_TELEGRAM_IDS: ${ALLOWED_TELEGRAM_IDS:-}
      API_TOKEN: ${API_TOKEN:?set API_TOKEN (e.g. openssl rand -hex 24)}
      HOST: 0.0.0.0
      PORT: ${PORT:-2137}
      DATA_DIR: /data
      COOKIES_FILE: ${COOKIES_FILE:-}
      SCAN_CRON: ${SCAN_CRON:-0 3 * * *}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "${PORT:-2137}:${PORT:-2137}"
    volumes:
      # In Portainer set HOST_DATA_DIR to an ABSOLUTE path (e.g. /srv/memehog)
      # — the relative default only makes sense for git-clone + install.sh.
      - ${HOST_DATA_DIR:-./data}:/data
